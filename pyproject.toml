[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefind"
version = "0.1.0"
description = "Versioned document retrieval with a reproducible relevance evaluation."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx2>=2,<3", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
tracefind = "tracefind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
